# Azure App Service Linux / PHP 8.x nginx site config.
# PHP 8 blessed images use nginx (not Apache). .htaccess is ignored.
#
# Portal → Configuration → General settings → Startup Command:
#   /bin/bash /home/site/wwwroot/startup.sh
#
# TLS is terminated in front of this container (nginx listens on 8080).
# fastcgi_param HTTPS must be set or WordPress is_ssl() is false and the
# installer emits http:// CSS/JS, which the browser blocks as mixed content.

server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm;
    server_name example.com www.example.com;
    port_in_redirect off;
    absolute_redirect off;

    location / {
        index index.php index.html index.htm hostingstart.html;
        try_files $uri $uri/ /index.php?$args;
    }

    # Never fall through to index.php for static assets (HTML-as-CSS = unstyled installer).
    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot|otf)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /html/;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.[Pp][Hh][Pp])(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        # Override fastcgi_params ($https is empty because this socket is HTTP/8080).
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_intercept_errors on;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }
}
